services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
    volumes:
      - ./storage:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./storage:/data:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params_app:/etc/nginx/proxy_params_app:ro
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
