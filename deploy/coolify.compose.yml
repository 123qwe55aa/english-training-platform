services:
  app:
    build:
      context: ..
      args:
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Coolify resource}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the Coolify resource}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
    volumes:
      - ${ENGLISH_PLATFORM_STORAGE:?Set ENGLISH_PLATFORM_STORAGE on the target server}:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ${ENGLISH_PLATFORM_STORAGE:?Set ENGLISH_PLATFORM_STORAGE on the target server}:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params_app:/etc/nginx/proxy_params_app:ro
