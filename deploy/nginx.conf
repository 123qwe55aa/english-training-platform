limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
 listen 8080;
 server_tokens off;
 client_max_body_size 2048m;
 client_body_timeout 300s;
 location /static/ { include /etc/nginx/mime.types; types { application/javascript mjs; } alias /data/static/; expires 7d; add_header X-Content-Type-Options nosniff; }
 location /media/ { return 404; }
 location /_protected_media/ { internal; alias /data/media/; add_header Cache-Control "private, no-store" always; add_header X-Content-Type-Options nosniff always; }
 location = /admin/login/ { limit_req zone=login burst=5 nodelay; proxy_pass http://app:8000; include /etc/nginx/proxy_params_app; }
 location / { proxy_pass http://app:8000; include /etc/nginx/proxy_params_app; }
}
